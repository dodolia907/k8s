apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: murchace-ingress
  namespace: murchace
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: murchace.ddlia.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: murchace
            port:
              number: 80
---
# tut-cc.org is a CNAME to murchace.ddlia.com managed in its own zone, so only
# the tunnel route is needed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: murchace-tut-cc-ingress
  namespace: murchace
  annotations:
    cloudflare-tunnel-ingress-controller.strrl.dev/disable-dns-management: "true"
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: murchace.tut-cc.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: murchace
            port:
              number: 80
