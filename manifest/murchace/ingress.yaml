apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: murchace-ingress
  namespace: murchace
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: murchace.tut-cc.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: murchace
            port:
              number: 80
  - host: murchace.ddlia.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: murchace
            port:
              number: 80
