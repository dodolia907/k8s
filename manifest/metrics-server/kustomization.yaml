# metrics-server (managed by Argo CD: install/argocd/metrics-server.yaml).
#
# kubeadm kubelets serve self-signed certificates, so metrics-server cannot
# verify them. --kubelet-insecure-tls skips that check; the connection is
# still encrypted. Drop the patch once kubelet serverTLSBootstrap is enabled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
patches:
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
