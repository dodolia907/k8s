apiVersion: v1
kind: Service
metadata:
  name: qlc
  namespace: dmx
  labels:
    announce: bgp-v4
    io.cilium/lb-pool: ula
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dmx.k8s.ddlia.com
    external-dns.alpha.kubernetes.io/provider: "pihole"
spec:
  selector:
    app: qlc
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ports:
  - name: artnet
    protocol: UDP
    port: 6454
    targetPort: 6454
  - name: http
    protocol: TCP
    port: 80
    targetPort: 9999
