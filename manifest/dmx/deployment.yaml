apiVersion: apps/v1
kind: Deployment
metadata:
  name: qlc
  namespace: dmx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qlc
  template:
    metadata:
      labels:
        app: qlc
    spec:
      nodeName: wk03
      containers:
      - name: qlc
        image: ghcr.io/technotut/qlcplus-artnet-to-dmx-converter:main@sha256:673d004ab50a7e6329899a41b9cebae3bf75a3e126f14f369aa890a950f8daf3
        securityContext:
          privileged: true
        ports:
        - containerPort: 6454
        - containerPort: 9999
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: qlc-hostpath
          mountPath: /dev/ttyUSB0
      volumes:
      - name: qlc-hostpath
        hostPath:
          path: /dev/ttyUSB0
