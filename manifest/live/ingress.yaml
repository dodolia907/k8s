apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-dashboard-ingress
  namespace: live
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: live.ddlia.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: live-dashboard
            port:
              number: 80
