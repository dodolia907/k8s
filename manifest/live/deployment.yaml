apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmp-deployment
  labels:
    app: rtmp-live-server
  namespace: live
spec:
  selector:
    matchLabels:
      app: rtmp-live-server
  replicas: 1
  template:
    metadata:
      labels:
        app: rtmp-live-server
    spec:
      securityContext:
        # GID 44 (video) / 105 (render) for host /dev/dri access
        supplementalGroups: [44, 105]
      containers:
      - name: rtmp-live-server
        image: ghcr.io/technotut/rtmp-live-server:main
        imagePullPolicy: Always
        ports:
        - containerPort: 1935
        - containerPort: 8080
        securityContext:
          privileged: false
        volumeMounts:
          - name: dev-dri
            mountPath: /dev/dri
          - name: thumbnails-tmpfs
            mountPath: /tmp/thumbnails
      volumes:
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: thumbnails-tmpfs
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-dashboard
  namespace: live
  labels:
    app.kubernetes.io/name: live-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/technotut/rtmp-live-server-dashboard:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: RTMP_STAT_URL
              value: "http://rtmp-service:80/stat"
            - name: RTMP_THUMBNAIL_BASE_URL
              value: "http://rtmp-service:80/thumbnails"
