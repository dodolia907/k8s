apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: discord-tts
resources:
  - rbac.yaml
  - deployment.yaml
  - networkpolicy.yaml
# The name gets a content hash, so changing a value restarts the bot.
configMapGenerator:
  - name: discord-tts-bot
    literals:
      - ACTIVITY_NAME=VCのチャットを読み上げ
