apiVersion: v1
kind: ServiceAccount
metadata:
  name: discord-tts-bot
---
# The bot starts one TTS Pod per voice session and deletes it on disconnect.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discord-tts-bot
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: discord-tts-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: discord-tts-bot
subjects:
- kind: ServiceAccount
  name: discord-tts-bot
