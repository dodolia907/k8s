# TTS Pods only turn text into audio. Only the bot may call them, and they call nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: discord-tts
      app.kubernetes.io/component: tts
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: discord-tts
          app.kubernetes.io/component: bot
  egress: []
