apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-deployment
  labels:
    app: time
  namespace: time
spec:
  selector:
    matchLabels:
      app: time
  replicas: 1
  template:
    metadata:
      labels:
        app: time
    spec:
      containers:
      - name: time
        image: ghcr.io/airyland/datetime.app:latest@sha256:b45966b04ea0308d1a922314103a04ac68df0e9792cfb55e0911454d33721405
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      restartPolicy: Always