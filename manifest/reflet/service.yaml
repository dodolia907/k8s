apiVersion: v1
kind: Service
metadata:
  name: reflet-backend
  namespace: reflet
spec:
  type: ClusterIP
  selector:
    app: reflet-backend
  ports:
    - name: api
      protocol: TCP
      port: 8080
      targetPort: api
---
# BGP from the gateway. Local keeps the gateway's source IP, which the peer
# address in config.toml is matched against.
apiVersion: v1
kind: Service
metadata:
  name: reflet-bgp
  namespace: reflet
  labels:
    announce: bgp-v4
  annotations:
    io.cilium/lb-ipam-ips: "10.88.255.5"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: reflet-backend
  ports:
    - name: bgp
      protocol: TCP
      port: 179
      targetPort: bgp
---
apiVersion: v1
kind: Service
metadata:
  name: reflet-web
  namespace: reflet
  labels:
    announce: bgp-v4
    io.cilium/lb-pool: ula
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  selector:
    app: reflet-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
