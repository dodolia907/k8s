# Helm values for Cilium. Used by the bootstrap in install.md and by
# install/argocd/apps/cilium.yaml, so keep the version in both in step.
ipv4:
  enabled: true
ipv6:
  enabled: true
routingMode: native
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 10.8.0.0/16
ipv6NativeRoutingCIDR: fdf6:ad60:1db0:feed::/56
autoDirectNodeRoutes: true
kubeProxyReplacement: true
k8sRequireIPv4PodCIDR: true
k8sRequireIPv6PodCIDR: true
# An IP, because the agent must reach the API before DNS works.
k8sServiceHost: 10.1.88.101
k8sServicePort: 6443
# L2 announcements renew one lease per Service: QPS = Services / leaseRenewDeadline.
k8sClientRateLimit:
  qps: 10
  burst: 20
devices: enp2s0
l2announcements:
  enabled: true
bgpControlPlane:
  enabled: true
enableIPv4Masquerade: false
enableIPv6Masquerade: true
# iptables masquerade lets the kernel pick the source address, so Pods leave
# through the node's current GUA after the RA prefix changes.
bpf:
  masquerade: false
ingressController:
  enabled: true
  loadbalancerMode: shared
  service:
    labels:
      announce: bgp-v4
      io.cilium/lb-pool: ula
# Keep resident memory low on 10GB nodes.
hubble:
  enabled: false
operator:
  replicas: 1
