apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: ipv6-ndp-policy
spec:
  interfaces:
  - enp2s0
  loadBalancerIPs: true
  externalIPs: true
  # Only Services that take an IPv6 address from a pool.
  serviceSelector:
    matchExpressions:
      - key: "io.cilium/lb-pool"
        operator: Exists
  nodeSelector:
    matchExpressions:
      - key: "kubernetes.io/os"
        operator: In
        values:
          - linux
