apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-cr.yaml
  - cdi-operator.yaml
  - cdi-cr.yaml
patches:
  # One replica per control-plane component to save memory.
  - target:
      kind: KubeVirt
      name: kubevirt
    patch: |-
      - op: add
        path: /spec/infra
        value:
          replicas: 1
