apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 10.1.88.101
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
  kubeletExtraArgs:
    # GUAはRA prefixの変更で変わるので指定しない。
    - name: node-ip
      value: 10.1.88.101,fd00:20::101
skipPhases:
  - addon/kube-proxy
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
# 全ノードの /etc/hosts で解決する。
controlPlaneEndpoint: k8s-api.internal:6443
networking:
  podSubnet: 10.8.0.0/16,fdf6:ad60:1db0:feed::/56
  serviceSubnet: 10.96.0.0/12,fdf6:ad60:1db0:beef::/112
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
systemReserved:
  memory: 512Mi
kubeReserved:
  memory: 512Mi
evictionHard:
  memory.available: 256Mi
