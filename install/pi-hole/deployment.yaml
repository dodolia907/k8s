apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-deployment
  labels:
    app: pihole
  namespace: dns
spec:
  selector:
    matchLabels:
      app: pihole
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pihole
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0

      initContainers:
      - name: init-sync
        image: docker.io/library/busybox:1.38
        command: ["/bin/sh", "-c"]
        args: ["cp -r /mnt-pvc/* /etc/pihole/ || true"]
        volumeMounts:
        - name: pihole-pvc
          mountPath: /mnt-pvc
        - name: pihole-data
          mountPath: /etc/pihole

      containers:
      - name: pihole
        image: ghcr.io/pi-hole/pihole:2026.10.1
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - SYS_TIME
              - SYS_NICE
              - SETFCAP
        ports:
        - containerPort: 53
        - containerPort: 80
        - containerPort: 443
        env:
        - name: TZ
          value: "Asia/Tokyo"
        - name: FTLCONF_NTP_ENABLED
          value: "false"
        - name: FTLCONF_webserver_api_password
          value: ""
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "cp -r /etc/pihole/* /mnt-pvc/"]
        volumeMounts:
        - name: pihole-data
          mountPath: /etc/pihole
        - name: dnsmasq-data
          mountPath: /etc/dnsmasq.d
        - name: pihole-pvc
          mountPath: /mnt-pvc

      volumes:
      - name: pihole-data
        emptyDir: {}
      - name: dnsmasq-data
        emptyDir: {}
      - name: pihole-pvc
        persistentVolumeClaim:
          claimName: pihole-pvc