apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ra-prefix-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: default
  source:
    repoURL: https://github.com/dodolia907/k8s.git
    targetRevision: HEAD
    # Submodule: github.com/dodolia907/ra-prefix-controller
    path: plugins/ra-prefix-controller/chart
    helm:
      valuesObject:
        interface: enp3s0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
