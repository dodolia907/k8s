# Argo CD itself and the root Application. Bootstrap with:
#   kubectl apply --server-side --force-conflicts -k install/argocd
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.1/manifests/install.yaml
  - root.yaml
patches:
  # Not needed here (no SSO, no notifications, no ApplicationSets).
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: &scaleToZero |-
      - op: add
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: *scaleToZero
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: *scaleToZero
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
        labels:
          announce: bgp-v4
          io.cilium/lb-pool: ula
        annotations:
          external-dns.alpha.kubernetes.io/provider: pihole
          external-dns.alpha.kubernetes.io/hostname: cd.svc.ddlia.com
      spec:
        type: LoadBalancer
        ipFamilyPolicy: PreferDualStack
