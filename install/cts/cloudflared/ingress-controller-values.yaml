cloudflare:
  secretRef:
    name: cloudflare-tunnel-ingress
    accountIDKey: account_id
    tunnelNameKey: tunnel_name
    apiTokenKey: api_token
image:
  tag: 0.1.0
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
cloudflared:
  image:
    tag: 2026.7.3-host-metrics.1
  # Single node: anti-affinity would leave a second replica Pending.
  replicaCount: 1
  podAntiAffinity: false
  extraArgs:
    # J:COM provides IPv4 only.
    - --edge-ip-version
    - "4"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
