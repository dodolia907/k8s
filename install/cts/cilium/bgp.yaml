# cts node (AS64513) - Si-R (AS65001) - VPN - NEC IX (AS65000) - FortiGate (AS65000) - tyh nodes (AS64512)
apiVersion: "cilium.io/v2"
kind: CiliumBGPPeerConfig
metadata:
  name: bgp-peer-config-si-r
spec:
  timers:
    holdTimeSeconds: 90
    keepAliveTimeSeconds: 30
  families:
  - afi: ipv4
    safi: unicast
    advertisements:
      matchLabels:
        advertise: bgp-v4-services
---
apiVersion: "cilium.io/v2"
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
  - name: "ipv4-bgp"
    localASN: 64513
    peers:
    - name: "si-r"
      peerAddress: "<Si-RのLAN側アドレス>"
      peerASN: 65001
      peerConfigRef:
        name: bgp-peer-config-si-r
---
# LB IPs only. Pods are masqueraded, so the PodCIDR needs no route.
apiVersion: "cilium.io/v2"
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-adv-ipv4
  labels:
    advertise: bgp-v4-services
spec:
  advertisements:
  - advertisementType: "Service"
    selector:
      matchLabels:
        announce: bgp-v4
    service:
      addresses:
      - LoadBalancerIP
