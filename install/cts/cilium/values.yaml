# Helm values for Cilium on cts. J:COM provides IPv4 only, so this is single-stack.
ipv4:
  enabled: true
ipv6:
  enabled: false
routingMode: native
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 10.9.0.0/16
kubeProxyReplacement: true
k8sRequireIPv4PodCIDR: true
k8sRequireIPv6PodCIDR: false
# An IP, because the agent must reach the API before DNS works.
k8sServiceHost: <ctsノードのIPv4>
k8sServicePort: 6443
devices: eth0
bgpControlPlane:
  enabled: true
# The Si-R has no route to the PodCIDR, so Pods leave through the node address.
enableIPv4Masquerade: true
bpf:
  masquerade: false
# Web traffic arrives through Cloudflare Tunnel.
ingressController:
  enabled: false
# Keep resident memory low.
hubble:
  enabled: false
operator:
  replicas: 1
